summary:
  text: "Mathematician and physicist with over 6 years of research experience in machine learning, stochastic modeling, and complex dynamical systems. My work combines probability theory, point processes, Markov chains, stochastic differential equations, and scientific computing, with applications in deep learning optimization, time-series modeling, causal analysis, finance, neuroscience, and sports forecasting."
  highlights:
    - "5 peer-reviewed research papers, including 3 single-author papers."
    - "16 research presentations at seminars, conferences, workshops, and poster sessions."

education:
  - period: "2024"
    title: "Doctor in Mathematics - Kyoto University"
    description: "Fully funded by the MEXT scholarship. Established results in point processes, probability theory, Markov chains, and renewal Hawkes processes."
  - period: "2021"
    title: "Master of Science in Physics - Kyoto University"
    description: "Fully funded by the MEXT scholarship. Developed nonparametric estimation methods for Hawkes processes using RKHS methods and applied them to neural time-series data."
  - period: "2016"
    title: "Bachelor in Physics - UNAM"
    description: "Emphasis in probability theory, topology, analysis, statistical mechanics, and dynamical systems."
  - period: "2011"
    title: "International Baccalaureate - ITESM CCM"
    description: "Graduated with a 36 point diploma, higher level Mathematics, and a perfect score of 7 in Physics."

experience:
  - period: "May 2024 - Apr 2026"
    title: "Machine Learning Researcher - Kyoto University"
    description: "Worked on SGD dynamics in LLM learning, soccer match outcome prediction, and cause-emotion utterance analysis using causal inference. Responsibilities included mathematical formulation, experimental design, implementation, model evaluation, verification, and code review."
  - period: "Jul 2022 - Dec 2023"
    title: "Research Assistant - Kyoto University"
    description: "Studied asymptotic normality for nonparametric estimators in multivariate discrete-time semi-Markov chains and organized the results into a peer-reviewed publication."
  - period: "Feb 2017 - Dec 2018"
    title: "Teaching Assistant - UNAM"
    description: "Supported Differential and Integral Calculus instruction for physics, mathematics, and actuarial majors through exercise design, assignments, student support, and class operation."

