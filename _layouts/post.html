---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/post.css' | relative_url }}">
<article class="post">
  <div class="post-body">
    <div class="post-content">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
      </header>
      {{ content }}
      <div class="share">
        <button id="share-btn" type="button" class="nav-btn">Share</button>
        <div id="share-links">
          <a id="share-x" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/x.svg' | relative_url }}" alt="X">
            X
          </a>
          <a id="share-linkedin" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/linkedin.svg' | relative_url }}" alt="LinkedIn">
            LinkedIn
          </a>
          <a id="share-facebook" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/facebook.svg' | relative_url }}" alt="Facebook">
            Facebook
          </a>
          <a id="share-gmail" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/gmail.svg' | relative_url }}" alt="Gmail">
            Gmail
          </a>
          <a id="share-whatsapp" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/whatsapp.svg' | relative_url }}" alt="WhatsApp">
            WhatsApp
          </a>
          <a id="share-line" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/line.svg' | relative_url }}" alt="LINE">
            LINE
          </a>
          <a id="share-native" class="nav-btn" href="#">
            <img src="{{ '/assets/icons/share.svg' | relative_url }}" alt="Share">
            Share
          </a>
          <button id="share-copy" type="button" class="nav-btn">
            <img src="{{ '/assets/icons/link.svg' | relative_url }}" alt="Copy link">
            Get URL
          </button>
        </div>
      </div>
      <section id="comments" class="comments">
        <h2>Comments</h2>
        {% if site.disqus_shortname %}
        <div id="disqus_thread"></div>
        <script>
        var disqus_config = function () {
          this.page.url = "{{content.absolute_url }}";
          this.page.identifier = "{{ content_id }}";
        };
        (function() {
          var d = document, s = d.createElement('script');
          s.src = 'https://luisivanhr.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
        })();
        </script>
        <noscript>Please enable JavaScript to view the comments powered by Disqus.</noscript>
        {% endif %}
      </section>
    </div>
    <aside class="post-sidebar">
      <a class="nav-btn back-top" href="{{ '/blog/' | relative_url }}">Back to top</a>
      <nav id="post-nav" class="local-nav"></nav>
    </aside>
  </div>
</article>
<script src="{{ '/assets/js/post.js' | relative_url }}"></script>
