
title: "Luis Iván — Research & Projects"
description: "Research blog, models, courses, and more."
url: "https://luisivanhr.github.io"  # set to your custom domain (e.g., https://luisivanhr.com)
baseurl: ""

disqus_shortname: luisivanhr

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - _news_state/news_update_state.yml
  - .bundle/
  - vendor/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/

collections:
  models:
    output: true
    permalink: /models/:title/
  courses:
    output: true
    permalink: /courses/:title/
  course_sections:
    output: true
    permalink: /courses/:path/
  news:
    output: false
    permalink: /news/:title/

defaults:
  - scope: {path: ""}
    values:
      layout: default
      image: /assets/images/og-default.png
  - scope: {path: "", type: "courses"}
    values:
      layout: course
  - scope: {path: "", type: "models"}
    values:
      layout: model
  - scope: {path: "", type: "course_sections"}
    values:
      layout: course-section
      course_section_style: theory

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Build JSON feeds to /data
permalink: pretty
